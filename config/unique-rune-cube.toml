# Unique/Set Scrapper probabilities. Changes take effect after restarting D2R.

[unique-rune-cube]
# Percent chance that the input item is consumed and no runes are produced.
failure-chance-percent = 30

[unique-rune-cube.output-count-weights]
# These are success-only percentages and must sum to 100.
one = 70
two = 25
three = 5

