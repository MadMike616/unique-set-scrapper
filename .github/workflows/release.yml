name: Release build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.3.2
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure x64 build
        run: cmake -S . -B build -A x64

      - name: Build Release DLL
        run: cmake --build build --config Release --target unique_rune_cube --verbose

      - name: Verify and publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'build/Release/d2rl-unique-rune-cube.dll'
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "Release output not found: $dll"
          }

          $version = (Get-Item -LiteralPath $dll).VersionInfo.FileVersion
          if ($version -ne '0.3.2') {
            throw "Expected Release DLL file version 0.3.2, got '$version'"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }
          $LASTEXITCODE = 0

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash
          $notes = @"
          ## Unique/Set Scrapper $env:RELEASE_TAG

          This DLL was built on a Windows x64 GitHub runner with CMake --config Release. The build log includes the compiler's Release optimization flags.

          ### Install

          1. Copy d2rl-unique-rune-cube.dll to the active mod's d2rloader/plugins/ directory.
          2. Copy unique-rune-cube.toml to the active mod's d2rloader/config/ directory and customize it if desired.
          3. Restart D2RLoader.

          ### Compatibility

          Windows x64 · D2R 3.3.93847 · D2RLoader 1.3.1-beta · PluginSDK 0.4.0 / ABI 4

          ### SHA-256

          d2rl-unique-rune-cube.dll: $hash
          "@
          Set-Content -LiteralPath 'release-notes.md' -Value $notes -Encoding utf8

          gh release create $env:RELEASE_TAG `
            $dll `
            'config/unique-rune-cube.toml' `
            --repo $env:GITHUB_REPOSITORY `
            --title "Unique/Set Scrapper $env:RELEASE_TAG" `
            --notes-file release-notes.md `
            --target $env:GITHUB_SHA

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release creation failed.'
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,name,url,assets
